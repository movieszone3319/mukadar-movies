<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUKADAR MOVIES ZONE - HD Stream</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #e50914; --bg-color: #000000; --card-bg: #141414; --text-color: #ffffff; --text-muted: #8c8c8c; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 40px; }
        header { position: sticky; top: 0; z-index: 100; background: rgba(0, 0, 0, 0.95); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; }
        .logo { font-size: 1.1rem; font-weight: bold; color: var(--primary-color); display: flex; align-items: center; gap: 8px; }
        .logo span { color: #fff; }
        .search-box { position: relative; width: 60%; }
        .search-box input { width: 100%; padding: 8px 12px 8px 34px; border-radius: 20px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 0.85rem; }
        .search-box i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #888; font-size: 0.85rem; }
        
        .categories { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; }
        .tab-btn { padding: 6px 14px; background: #222; border: 1px solid #333; border-radius: 20px; color: #fff; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: var(--primary-color); border-color: var(--primary-color); }

        .section-title { padding: 10px 16px; font-weight: bold; font-size: 1rem; color: #fff; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; padding: 0 16px; }
        .movie-card { background: var(--card-bg); border-radius: 6px; overflow: hidden; cursor: pointer; position: relative; border: 1px solid #222; }
        .movie-poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #1a1a1a; display: block; }
        .movie-info { padding: 6px; }
        .movie-title { font-size: 0.75rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Netflix Style OTT Detail View */
        .detail-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; overflow-y: auto; }
        .detail-header { position: relative; width: 100%; height: 260px; background-size: cover; background-position: center; }
        .detail-header::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, #000, transparent); }
        .back-btn { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7); color: #fff; border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 1.1rem; z-index: 1010; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .detail-body { padding: 16px; margin-top: -30px; position: relative; z-index: 10; }
        .flex-row { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
        .thumb-poster { width: 95px; aspect-ratio: 2/3; border-radius: 6px; object-fit: cover; border: 2px solid #333; }
        .detail-title { font-size: 1.2rem; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .meta-info { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 10px; margin-bottom: 6px; }
        .ratings { color: #f5c518; font-size: 0.8rem; }
        
        .action-buttons { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
        .btn-play { width: 100%; padding: 12px; background: var(--primary-color); color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .overview-section { font-size: 0.85rem; color: #ccc; line-height: 1.4; margin-bottom: 16px; }
        .info-block { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
        .info-block span { color: #fff; }

        /* Video Player Modal */
        .player-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; justify-content: center; align-items: center; }
        .player-box { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
        .player-box iframe { width: 100%; height: 100%; border: none; }
        .player-close { position: absolute; top: -45px; right: 10px; color: #fff; font-size: 1.8rem; cursor: pointer; background: rgba(0,0,0,0.5); width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fas fa-play-circle"></i> MUKADAR <span>ZONE</span></div>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search Reacher, Legion, Movies..." onkeyup="filterContent(this.value)">
        </div>
    </header>

    <div class="categories">
        <button class="tab-btn active" onclick="loadCategory('all', this)">🔥 All Stream</button>
        <button class="tab-btn" onclick="loadCategory('series', this)">📺 Reacher & Series</button>
        <button class="tab-btn" onclick="loadCategory('movies', this)">🎬 HD Movies</button>
    </div>

    <div class="section-title">Reacher S1-S4, Legion & World Movies (HD)</div>

    <div class="movie-grid" id="movieGrid">
        <!-- Content List -->
    </div>

    <!-- Netflix Style OTT Detail Modal -->
    <div class="detail-modal" id="detailModal">
        <div class="detail-header" id="modalHeaderBg">
            <button class="back-btn" onclick="closeDetail()"><i class="fas fa-arrow-left"></i></button>
        </div>
        <div class="detail-body">
            <div class="flex-row">
                <img id="modalPoster" src="" class="thumb-poster">
                <div>
                    <div class="detail-title" id="modalTitle">Title</div>
                    <div class="meta-info">
                        <span id="modalYearTime">2026 • HD</span>
                        <span class="ratings">★★★★★</span>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn-play" onclick="playMovie()"><i class="fas fa-play"></i> Play Full Stream</button>
            </div>

            <div class="overview-section" id="modalDesc">Streaming live in high definition with multi-language support.</div>
            <div class="info-block">Quality: <span>480p, 720p, 1080p Full HD</span></div>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div class="player-modal" id="playerModal">
        <div class="player-box">
            <span class="player-close" onclick="closePlayer()">&times;</span>
            <iframe id="videoIframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const mediaList = [
            { title: "Reacher S1 (Hindi)", type: "series", cat: "series", poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500", desc: "Jack Reacher Season 1 full Hindi dubbed streaming.", url: "https://embed.su/embed/tv/9288030/1/1" },
            { title: "Reacher S2 (Hindi)", type: "series", cat: "series", poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500", desc: "Jack Reacher Season 2 full Hindi dubbed streaming.", url: "https://embed.su/embed/tv/9288030/2/1" },
            { title: "Reacher S3 (Hindi)", type: "series", cat: "series", poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500", desc: "Jack Reacher Season 3 full Hindi dubbed streaming.", url: "https://embed.su/embed/tv/9288030/3/1" },
            { title: "Reacher S4 (Hindi)", type: "series", cat: "series", poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500", desc: "Jack Reacher Season 4 full Hindi dubbed streaming.", url: "https://embed.su/embed/tv/9288030/4/1" },
            { title: "Legion Movie (Hindi)", type: "movie", cat: "movies", poster: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500", desc: "Legion full Hindi dubbed horror action movie.", url: "https://embed.su/embed/movie/1038686" },
            { title: "Legion Series (Hindi)", type: "series", cat: "series", poster: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500", desc: "Legion TV series full episodes in Hindi.", url: "https://embed.su/embed/tv/5114356/1/1" },
            { title: "Pathaan (Hindi)", type: "movie", cat: "movies", poster: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500", desc: "Pathaan full action blockbuster in Hindi.", url: "https://embed.su/embed/movie/12844910" },
            { title: "Avatar 2 (HD)", type: "movie", cat: "movies", poster: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500", desc: "Avatar: The Way of Water full movie streaming.", url: "https://embed.su/embed/movie/1630029" },
            { title: "Money Heist S1", type: "series", cat: "series", poster: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=500", desc: "Money Heist Season 1 full episodes streaming.", url: "https://embed.su/embed/tv/6468322/1/1" }
        ];

        let activePlayUrl = "";

        function renderGrid(items) {
            let grid = document.getElementById('movieGrid');
            grid.innerHTML = "";
            items.forEach(item => {
                let card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openDetail(item);
                card.innerHTML = `
                    <img src="${item.poster}" class="movie-poster">
                    <div class="movie-info"><div class="movie-title">${item.title}</div></div>
                `;
                grid.appendChild(card);
            });
        }

        renderGrid(mediaList);

        function openDetail(item) {
            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalDesc').innerText = item.desc;
            document.getElementById('modalPoster').src = item.poster;
            document.getElementById('modalHeaderBg').style.backgroundImage = `url('${item.poster}')`;
            activePlayUrl = item.url;
            document.getElementById('detailModal').style.display = 'block';
        }

        function closeDetail() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function playMovie() {
            document.getElementById('videoIframe').src = activePlayUrl;
            document.getElementById('playerModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('videoIframe').src = '';
            document.getElementById('playerModal').style.display = 'none';
        }

        function filterContent(query) {
            let filtered = mediaList.filter(i => i.title.toLowerCase().includes(query.toLowerCase()));
            renderGrid(filtered);
        }

        function loadCategory(cat, btn) {
            let buttons = document.getElementsByClassName('tab-btn');
            for (let b of buttons) b.classList.remove('active');
            btn.classList.add('active');

            if(cat === 'all') {
                renderGrid(mediaList);
            } else {
                renderGrid(mediaList.filter(i => i.cat === cat));
            }
        }
    </script>
</body>
</html>
